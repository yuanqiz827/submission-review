{% extends 'base.html' %}
{% block title %}登入 · 投稿審查系統{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
  <p class="eyebrow">作者與編輯登入</p>
  <h1>登入投稿審查系統</h1>
  <p class="intro">使用自己的帳號與密碼登入，系統會依帳號角色顯示可使用的功能。</p>
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="editor-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field"><label for="username">帳號</label><input id="username" name="username" value="{{ username }}" maxlength="40" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">密碼</label><input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required></div>
    <div class="form-actions"><button type="submit">登入</button></div>
    <p class="muted">此處使用系統使用者帳密，與 PostgreSQL 資料庫連線密碼不同。</p>
  </form>
{% endblock %}
